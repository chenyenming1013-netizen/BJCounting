<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#123D2C" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>算牌紀錄器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23123D2C'/%3E%3Crect x='18' y='12' width='28' height='40' rx='5' fill='%23F6F1E4'/%3E%3Ctext x='32' y='40' font-family='Georgia' font-size='20' text-anchor='middle' fill='%23B3261E'%3EA%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex">
<style>
:root{
  --felt:#123D2C; --felt-deep:#0B2A1E; --felt-line:#2F6650;
  --ivory:#F6F1E4; --ink:#1A1A1A; --red:#B3261E; --gold:#E8B53A; --gold-ink:#3A2600;
  --muted:#A3C4B4;
  --chat-bg:#8CABD9; --chat-hot:#E2A898; --bubble-me:#8DE055;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--felt);color:var(--ivory);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}

.modes{display:grid;grid-template-columns:repeat(4,1fr);background:var(--felt-deep);border-radius:999px;padding:4px}
.modes button{border:0;background:transparent;color:var(--muted);font-size:15px;padding:10px 4px;border-radius:999px}
.modes button[aria-pressed="true"]{background:var(--ivory);color:var(--ink);font-weight:600}

.board{border:1.5px solid var(--felt-line);border-radius:20px;padding:12px 18px 14px;display:flex;align-items:flex-end;justify-content:space-between;transition:background-color .2s,border-color .2s,color .2s}
.board-label{font-size:14px;color:var(--muted);margin-bottom:2px}
.count{font-family:Georgia,"Times New Roman",serif;font-size:88px;line-height:1;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-2px}
.meta-n{text-align:right;color:var(--muted);font-size:14px;line-height:1.4}
.meta-n b{display:block;color:var(--ivory);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.board.hot{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.board.hot .board-label,.board.hot .meta-n,.board.hot .meta-n b{color:var(--gold-ink)}

.log{display:flex;gap:6px;overflow-x:auto;min-height:30px;scrollbar-width:none}
.log::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--felt-deep);border-radius:8px;padding:5px 9px;font-size:14px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ivory);font-weight:600;margin-right:3px}
.chip:first-child{outline:1.5px solid var(--felt-line)}
.empty{font-size:14px;color:var(--muted);padding:5px 0}

.panel{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.simple{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:200px}
.big{border-radius:22px;font-family:Georgia,"Times New Roman",serif;font-size:72px;line-height:1;transition:transform .08s}
.big.minus{background:var(--felt-deep);color:var(--ivory);border:1.5px solid var(--felt-line)}
.big.plus{background:var(--ivory);color:var(--ink);border:0}
.big small{display:block;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;font-size:14px;margin-top:10px}
.big.minus small{color:var(--muted)}
.big.plus small{color:#5A5A5A}

.cards{display:flex;flex-direction:column;gap:6px}
.group-label{font-size:13px;color:var(--muted);margin:4px 0 0 2px}
.row{display:flex;gap:8px}
.card{flex:0 0 calc((100% - 32px) / 5);height:clamp(62px,11dvh,96px);background:var(--ivory);color:var(--ink);border:0;border-radius:10px;position:relative;font-family:Georgia,"Times New Roman",serif;font-size:30px;transition:transform .08s}
.card .v{position:absolute;top:5px;left:7px;font-family:-apple-system,"PingFang TC",sans-serif;font-size:12px;font-weight:600}
.card.plus{color:var(--red)}
.card.zero{background:#DCD6C6;color:#55524A}
.big:active,.card:active{transform:scale(.95)}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tools button{background:transparent;border:1.5px solid var(--felt-line);color:var(--ivory);font-size:16px;padding:14px;border-radius:14px}
.tools button.arm{background:var(--red);border-color:var(--red)}

.flash{animation:flash .18s ease-out}
@keyframes flash{from{transform:scale(1.06)}to{transform:scale(1)}}

.chat{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--chat-bg);color:#111;transition:background-color .35s}
.chat.hot{background:var(--chat-hot)}
.c-head{display:flex;align-items:center;gap:2px;padding:calc(6px + env(safe-area-inset-top)) 6px 6px;background:rgba(0,0,0,.05)}
.c-name{font-size:17px;font-weight:600;margin-left:2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{width:42px;height:42px;border:0;background:transparent;color:#1f2a38;display:flex;align-items:center;justify-content:center;border-radius:10px}
.hb:active,.ic:active{background:rgba(0,0,0,.08)}
.hb svg,.ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.c-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 16px;display:flex;flex-direction:column;gap:10px;user-select:text}
.day{align-self:center;background:rgba(0,0,0,.16);color:#fff;font-size:12px;padding:3px 12px;border-radius:999px;margin-bottom:4px}
.msg{display:flex;align-items:flex-end;gap:6px;animation:pop .16s ease-out}
.msg.me{justify-content:flex-end}
.msg.them{align-items:flex-start}
.bubble{max-width:70vw;padding:9px 13px;border-radius:18px;font-size:16px;line-height:1.45;word-break:break-word}
.me .bubble{background:var(--bubble-me);border-top-right-radius:5px}
.them .bubble{background:#fff;border-top-left-radius:5px}
.meta{font-size:11px;color:rgba(0,0,0,.5);line-height:1.3;white-space:nowrap;text-align:right}
.them .meta{text-align:left;align-self:flex-end}
.them-body{display:flex;flex-direction:column}
.them-row{display:flex;align-items:flex-end;gap:6px}
.name{font-size:12px;color:rgba(0,0,0,.6);margin:0 0 3px 2px}
.av{width:38px;height:38px;border-radius:50%;background:#F5C9A3;color:#7A4A22;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.av.ghost{visibility:hidden;height:1px}
.c-bar{display:flex;align-items:center;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:#fff}
.ic{width:50px;height:46px;border:0;background:transparent;color:#3a3f45;display:flex;align-items:center;justify-content:center;border-radius:12px;flex:none}
.ic svg{width:26px;height:26px}
.fake-input{flex:1;height:38px;border-radius:19px;background:#F1F2F4;color:#9AA0A6;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;font-size:15px}
.fake-input svg{width:20px;height:20px;stroke:#9AA0A6;fill:none;stroke-width:1.8;stroke-linecap:round}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:5}
.sheet{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
.sheet button{display:block;width:100%;text-align:left;padding:16px 22px;border:0;background:none;font-size:16px;color:#111}
.sheet button:active{background:#f1f1f1}
.sheet button.danger{color:#D93025}
.sheet hr{border:0;border-top:1px solid #eee;margin:4px 0}
.fb{position:fixed;inset:0;display:flex;flex-direction:column;background:#F0F2F5;color:#050505;overflow:hidden}
.fb-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px 16px;background:#fff;transition:background-color .35s}
.fb.hot .fb-top{background:#FFE1CC}
.fb-title{flex:1;font-size:25px;font-weight:700;color:#1877F2;letter-spacing:-.5px}
.fb-ib{width:40px;height:40px;border-radius:50%;background:#E4E6EB;border:0;display:flex;align-items:center;justify-content:center;color:#050505;flex:none}
.fb-ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fb-feed{flex:1;min-height:0;padding-top:8px;touch-action:none;overflow:hidden}
.post{background:#fff;will-change:transform}
.post.peek{margin-top:8px}
.p-head{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.p-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600;flex:none}
.p-name{font-size:15px;font-weight:600}
.p-sub{font-size:13px;color:#65676B}
.p-more{margin-left:auto;color:#65676B;font-size:20px;letter-spacing:1px}
.p-text{padding:0 14px 10px;font-size:15px;line-height:1.4}
.ph{position:relative;width:100%;height:min(100vw,calc(100dvh - 300px));overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-touch-callout:none}
.p-react{display:flex;align-items:center;gap:6px;padding:10px 14px;font-size:14px;color:#65676B;border-bottom:1px solid #E4E6EB}
.p-acts{display:grid;grid-template-columns:repeat(3,1fr);padding:2px 6px}
.p-acts span{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;font-size:15px;color:#65676B;font-weight:600}
.p-acts svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fb.hot .p-acts .like{color:#1877F2}
.fb.hot .p-acts .like svg{fill:#1877F2}
.ov{position:absolute;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Helvetica Neue",Arial,"PingFang TC",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.ov-scrim{inset:0;background:rgba(0,0,0,.3)}
.ov-big{inset:0;flex-direction:column;color:#fff;font-size:min(24vw,120px);font-weight:800;line-height:1;letter-spacing:-2px;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.ov-big small{font-size:20px;font-weight:600;letter-spacing:3px;margin-bottom:8px}
.ov-glass{left:14px;top:14px;flex-direction:column;align-items:flex-start;background:rgba(0,0,0,.52);color:#fff;border-radius:18px;padding:10px 18px}
.ov-glass small{font-size:13px;opacity:.9}
.ov-glass b{font-size:46px;line-height:1.1}
.ov-card{left:14px;right:14px;bottom:14px;justify-content:space-between;background:#fff;color:#111;border-radius:14px;padding:10px 18px;font-size:15px}
.ov-card b{font-size:36px}
.ov-pill{right:14px;bottom:14px;border-radius:999px;padding:10px 22px;font-size:34px;font-weight:800;color:#fff}
.ov-clock{left:50%;top:50%;transform:translate(-50%,-50%);background:#111;color:#FF5A36;border-radius:14px;padding:12px 24px;font-size:64px;font-weight:700;font-family:"Courier New",monospace}
.ov-circle{left:50%;top:50%;transform:translate(-50%,-50%);width:min(52vw,220px);height:min(52vw,220px);border-radius:50%;background:#fff;border:14px solid #D93025;color:#111;font-size:min(20vw,92px);font-weight:800}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-height:640px){.count{font-size:64px}.big{font-size:56px}}
</style>
</head>
<body>
<main class="app" id="counterView">
  <div class="modes" role="group" aria-label="切換模式">
    <button id="m-simple" aria-pressed="true">簡易版</button>
    <button id="m-normal" aria-pressed="false">普通版</button>
    <button id="m-chat" aria-pressed="false">對話版</button>
    <button id="m-fb" aria-pressed="false">臉書版</button>
  </div>

  <section class="board" id="board" aria-live="polite">
    <div>
      <p class="board-label" id="board-label">累積數值</p>
      <p class="count" id="count">0</p>
    </div>
    <div class="meta-n">已記錄<b id="n">0</b>張</div>
  </section>

  <div class="log" id="log" aria-label="最近紀錄"><span class="empty">點下方按鈕開始記錄</span></div>

  <section class="panel" id="p-simple">
    <div class="simple">
      <button class="big minus" data-v="-1" data-l="">−1<small>2 – 6</small></button>
      <button class="big plus" data-v="1" data-l="">+1<small>10 J Q K A</small></button>
    </div>
  </section>

  <section class="panel" id="p-normal" hidden>
    <div class="cards" id="cards"></div>
  </section>

  <div class="tools">
    <button id="undo">復原上一張</button>
    <button id="reset">全部重設</button>
  </div>
</main>

<section class="chat" id="chatView" hidden>
  <header class="c-head">
    <button class="hb" id="c-back" aria-label="返回計數器"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="c-name">小美</div>
    <button class="hb" aria-label="搜尋" tabindex="-1"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg></button>
    <button class="hb" aria-label="通話" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M5 4h3.5l1.5 4-2 1.5a11 11 0 005.5 5.5l1.5-2 4 1.5V18a2 2 0 01-2 2A15 15 0 013 6a2 2 0 012-2z"/></svg></button>
    <button class="hb" id="c-menu" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <div class="c-list" id="c-list"><div class="day">今天</div></div>
  <div class="c-bar">
    <button class="ic" id="c-plus" aria-label="加一"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="fake-input" aria-hidden="true"><span>Aa</span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9 14.5c1.6 1.6 4.4 1.6 6 0M9.5 10h.01M14.5 10h.01"/></svg></div>
    <button class="ic" id="c-minus" aria-label="減一"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  </div>
  <div class="sheet-bg" id="sheet" hidden>
    <div class="sheet" role="menu">
      <button id="s-undo">收回上一則訊息</button>
      <button id="s-clear" class="danger">清除聊天記錄</button>
      <button id="s-back">回到計數器</button>
      <hr>
      <button id="s-cancel">取消</button>
    </div>
  </div>
</section>

<section class="fb" id="fbView" hidden>
  <header class="fb-top">
    <div class="fb-title">動態</div>
    <button class="fb-ib" aria-label="搜尋" tabindex="-1"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg></button>
    <button class="fb-ib" aria-label="訊息" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M12 3.5c-4.8 0-8.5 3.4-8.5 7.8 0 2.4 1.1 4.5 2.9 5.9V21l3.2-1.8c.8.2 1.6.3 2.4.3 4.8 0 8.5-3.4 8.5-7.8S16.8 3.5 12 3.5z"/></svg></button>
    <button class="fb-ib" id="f-menu" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <div class="fb-feed" id="fb-feed"><article class="post" id="fb-post"></article><article class="post peek" id="fb-next" aria-hidden="true"></article></div>
  <div class="sheet-bg" id="f-sheet" hidden>
    <div class="sheet" role="menu">
      <button id="f-undo">復原上一步</button>
      <button id="f-clear" class="danger">清除重來</button>
      <button id="f-back">回到計數器</button>
      <hr>
      <button id="f-cancel">取消</button>
    </div>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const groups = [
  {label:"−1", v:-1, cls:"minus", ranks:["2","3","4","5","6"]},
  {label:"0",  v:0,  cls:"zero",  ranks:["7","8","9"]},
  {label:"+1", v:1,  cls:"plus",  ranks:["10","J","Q","K","A"]}
];
let hist = [];
let msgs = [];
let mode = "simple";
let lastCounterMode = "simple";

const fmt = n => n > 0 ? "+" + n : n < 0 ? "−" + Math.abs(n) : "0";
const total = () => hist.reduce((s, h) => s + h.v, 0);
const vib = () => { if (navigator.vibrate) navigator.vibrate(12); };

groups.forEach(g => {
  const lab = document.createElement("p");
  lab.className = "group-label";
  lab.textContent = g.label;
  const row = document.createElement("div");
  row.className = "row";
  g.ranks.forEach(r => {
    const b = document.createElement("button");
    b.className = "card " + g.cls;
    b.dataset.v = g.v;
    b.dataset.l = r;
    b.setAttribute("aria-label", r + "，" + g.label);
    b.innerHTML = '<span class="v">' + g.label + '</span>' + r;
    row.appendChild(b);
  });
  $("cards").append(lab, row);
});

$("counterView").addEventListener("click", e => {
  const b = e.target.closest("[data-v]");
  if (!b) return;
  hist.push({l: b.dataset.l, v: Number(b.dataset.v)});
  vib();
  render(true);
});

function render(pulse){
  const c = total();
  const el = $("count");
  el.textContent = fmt(c);
  if (pulse){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  $("n").textContent = hist.length;
  const hot = c >= 10;
  $("board").classList.toggle("hot", hot);
  $("chatView").classList.toggle("hot", hot);
  $("fbView").classList.toggle("hot", hot);
  $("board-label").textContent = hot ? "已達 +10 以上" : "累積數值";
  const log = $("log");
  if (!hist.length){ log.innerHTML = '<span class="empty">點下方按鈕開始記錄</span>'; return; }
  log.innerHTML = hist.slice(-30).reverse().map(h =>
    '<span class="chip">' + (h.l ? '<b>' + h.l + '</b>' : '') + fmt(h.v) + '</span>'
  ).join("");
  log.scrollLeft = 0;
}

/* ---- 對話版：每則訊息只含一個數字，就是目前累積值 ----
   正數：一般句子；負數：句中一定有「跌、零下、少、掉、扣、降」；0：直接寫 0 */
const TIME = [
  n => `今天${n}點吃飯？`, n => `明天${n}點見`, n => `${n}點開會別忘了`,
  n => `我大概${n}點到`, n => `晚上${n}點打給你`, n => `${n}點那班車可以嗎`
];
const POS = [
  n => `我在${n}號出口等你`, n => `排了${n}分鐘才買到`, n => `訂位${n}位可以嗎`,
  n => `已經追到第${n}集了`, n => `我們坐${n}號桌`, n => `現在外面${n}度`,
  n => `電梯停在${n}樓`, n => `${n}分鐘後到`, n => `團購算我${n}份`,
  n => `這週跑了${n}公里`, n => `買了${n}杯飲料`, n => `群組有${n}個人要來`
];
const NEG = [
  n => `股票又跌了${n}%`, n => `山上零下${n}度好冷`, n => `這個月少賺${n}萬`,
  n => `體重掉了${n}公斤`, n => `又被扣${n}分`, n => `比上次少${n}個人`,
  n => `溫度降了${n}度`, n => `油價跌${n}毛`, n => `報名少了${n}位`
];
const ZERO = [
  () => `今天喝了0杯水`, () => `手機電量剩0%了`, () => `目前0個人回覆`,
  () => `今天運動時間0分鐘`, () => `未讀信件0封，舒服`
];
const TAILS = ["", "", "", "～", "！", " 😂", " 👍", " 🙏", "耶", "喔"];
let lastFn = null;
const pick = a => a[Math.floor(Math.random() * a.length)];

function makeText(c){
  let pool;
  if (c === 0) pool = ZERO;
  else if (c < 0) pool = NEG;
  else pool = c <= 12 ? POS.concat(TIME, TIME) : POS;
  let fn, tries = 0;
  do { fn = pick(pool); tries++; } while (fn === lastFn && tries < 8);
  lastFn = fn;
  let t = fn(Math.abs(c));
  if (!/[？！]$/.test(t)) t += pick(TAILS);
  return t;
}

function nowText(){
  const d = new Date(), h = d.getHours(), m = String(d.getMinutes()).padStart(2, "0");
  return (h < 12 ? "上午 " : "下午 ") + (h % 12 || 12) + ":" + m;
}

function msgEl(m, prev){
  const d = document.createElement("div");
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = m.text;
  if (m.me){
    d.className = "msg me";
    d.innerHTML = '<div class="meta">已讀<br>' + m.time + '</div>';
    d.appendChild(b);
  } else {
    const first = !(prev && !prev.me);
    d.className = "msg them";
    d.innerHTML = '<div class="av' + (first ? '' : ' ghost') + '">美</div><div class="them-body">' +
      (first ? '<div class="name">小美</div>' : '') + '<div class="them-row"></div></div>';
    const row = d.querySelector(".them-row");
    row.appendChild(b);
    row.insertAdjacentHTML("beforeend", '<div class="meta">' + m.time + '</div>');
  }
  return d;
}

function addMsg(c){
  const m = {text: makeText(c), me: Math.random() < 0.5, time: nowText(), c};
  const prev = msgs[msgs.length - 1];
  msgs.push(m);
  const list = $("c-list");
  list.appendChild(msgEl(m, prev));
  list.scrollTop = list.scrollHeight;
}

function syncChat(){
  const shown = msgs.length ? msgs[msgs.length - 1].c : 0;
  if (shown !== total()) addMsg(total());
}

function chatStep(v){
  hist.push({l: "", v});
  vib();
  render(false);
  addMsg(total());
}
$("c-plus").onclick = () => chatStep(1);
$("c-minus").onclick = () => chatStep(-1);

function undoLast(){
  hist.pop();
  if (msgs.length){ msgs.pop(); $("c-list").lastElementChild.remove(); }
  render(false);
  syncChat();
}
function clearAll(){
  hist = []; msgs = []; lastFn = null;
  $("c-list").innerHTML = '<div class="day">今天</div>';
  render(false);
}

/* ---- 選單 ---- */
const sheet = $("sheet");
let clearArmed = false;
function closeSheet(){ sheet.hidden = true; clearArmed = false; $("s-clear").textContent = "清除聊天記錄"; }
$("c-menu").onclick = () => { sheet.hidden = false; };
sheet.onclick = e => { if (e.target === sheet) closeSheet(); };
$("s-cancel").onclick = closeSheet;
$("s-undo").onclick = () => { undoLast(); closeSheet(); };
$("s-clear").onclick = () => {
  if (!clearArmed){ clearArmed = true; $("s-clear").textContent = "再按一次確認清除"; return; }
  clearAll(); closeSheet();
};
$("s-back").onclick = () => { closeSheet(); setMode(lastCounterMode); };
$("c-back").onclick = () => setMode(lastCounterMode);

/* ---- 臉書版：上滑 +1、下滑 −1；圖片裡的數字就是目前累積值
   規則：數字前面有「−」就是負數，沒有就是正數或 0 ---- */
const sg = (c, plus) => c > 0 ? (plus ? "+" + c : String(c)) : c < 0 ? "−" + (-c) : "0";
const STYLES = [
  {ok: c => true, html: c => `<div class="ov ov-glass"><small>${c < 0 ? "❄️" : "☀️"} 現在氣溫</small><b>${sg(c)}°C</b></div>`,
   cap: ["今天出門記得看天氣", "這天氣也太誇張了吧", "週末出去走走", "早晚溫差好大"]},
  {ok: c => true, html: c => `<div class="ov ov-card"><span>今日漲跌</span><b style="color:${c > 0 ? "#1E8E3E" : c < 0 ? "#D93025" : "#555"}">${c > 0 ? "▲ " : c < 0 ? "▼ " : ""}${sg(c)}%</b></div>`,
   cap: ["今天盤面好刺激", "存股日記", "看盤看到眼睛好痠", "投資要有耐心"]},
  {ok: c => c !== 0, html: c => `<div class="ov ov-pill" style="background:${c < 0 ? "#1E8E3E" : "#E8710A"}">${sg(c, true)} kg</div>`,
   cap: ["減重日記", "健身房報到", "飲控真的好難", "今天也有乖乖運動"]},
  {ok: c => c !== 0, html: c => `<div class="ov ov-glass"><small>⛳ 相對標準桿</small><b>${sg(c, true)}</b></div>`,
   cap: ["揮桿日", "球場天氣超好", "練習場報到"]},
  {ok: c => c > 0, html: c => `<div class="ov ov-scrim"></div><div class="ov ov-big"><small>DAY</small>${c}</div>`,
   cap: ["挑戰打卡", "堅持下去", "每天進步一點點", "早起打卡成功"]},
  {ok: c => c >= 1 && c <= 12, html: c => `<div class="ov ov-clock">${c}:00</div>`,
   cap: ["準時赴約", "等人中", "今天的行程", "鬧鐘響了"]},
  {ok: c => c > 0, html: c => `<div class="ov ov-card"><span>▲ 樓層</span><b>${c}F</b></div>`,
   cap: ["新辦公室", "看房中", "這層景觀不錯"]},
  {ok: c => c > 0, html: c => `<div class="ov ov-circle">${c}</div>`,
   cap: ["今天去兜風", "路上小心", "騎車出去晃晃"]},
  {ok: c => c >= 0, html: c => `<div class="ov ov-card"><span>🔋 電量</span><b>${c}%</b></div>`,
   cap: ["手機快沒電", "出門忘記充電", "行動電源救我"]},
  {ok: c => c > 0, html: c => `<div class="ov ov-scrim"></div><div class="ov ov-big"><small>生日快樂</small>${c}</div>`,
   cap: ["謝謝大家的祝福", "生日快樂", "又長大一歲"]},
  {ok: c => c > 0, html: c => `<div class="ov ov-pill" style="background:#D93025">倒數 ${c} 天</div>`,
   cap: ["好期待", "快到了", "倒數中"]},
  {ok: c => c < 0, html: c => `<div class="ov ov-glass"><small>🤿 潛水深度</small><b>${sg(c)} m</b></div>`,
   cap: ["潛水日記", "海底好美", "第一次深潛"]},
  {ok: c => c !== 0, html: c => `<div class="ov ov-card"><span>比賽得分</span><b>${sg(c, true)} 分</b></div>`,
   cap: ["今天的比賽", "運動會", "小考結果出爐"]}
];
const NAMES = [["林怡君","#E4405F"],["陳志明","#1877F2"],["王小美","#F5A623"],["張家豪","#2BA84A"],["李佳穎","#8E44AD"],
  ["黃俊傑","#16A085"],["吳雅婷","#D35400"],["劉建宏","#2C3E50"],["蔡宜蓁","#C0392B"],["許文彥","#2980B9"]];
const CAP_TAILS = ["", "", " ✨", " 😊", " 🙌", "！", "～"];
const ICON_LIKE = '<svg viewBox="0 0 24 24"><path d="M7 11v9H4v-9h3zm0 0l4-7c1.3 0 2 .9 2 2v3h5.5a2 2 0 012 2.3l-1.2 6A2 2 0 0117.3 20H7"/></svg>';
const ICON_CMT = '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>';
const ICON_SHARE = '<svg viewBox="0 0 24 24"><path d="M14 5l7 7-7 7v-4c-5 0-8 1.5-10 5 .5-5 3-10 10-11z"/></svg>';
const photoURL = s => `https://picsum.photos/seed/bjc${s}/700/700`;
const randSeed = () => 1 + Math.floor(Math.random() * 100);
let photoQ = null, lastStyle = null;
const preloaded = [];
function preload(s){ const i = new Image(); i.src = photoURL(s); preloaded.push(i); if (preloaded.length > 6) preloaded.shift(); }
function nextPhoto(){
  if (!photoQ){ photoQ = []; while (photoQ.length < 3){ const n = randSeed(); if (!photoQ.includes(n)) photoQ.push(n); } photoQ.forEach(preload); }
  const s = photoQ.shift();
  let n; do { n = randSeed(); } while (n === s || photoQ.includes(n));
  photoQ.push(n); preload(n);
  return s;
}
const PEEK_CAPS = ["分享一下今天的午餐", "好久沒出來走走了", "這家店推薦給大家", "週末的小確幸", "路邊隨手拍", "今天的天空好美"];
function peekHTML(){
  const nm = pick(NAMES), hue = Math.floor(Math.random() * 360);
  return `<div class="p-head"><div class="p-av" style="background:${nm[1]}">${nm[0][0]}</div>` +
    `<div><div class="p-name">${nm[0]}</div><div class="p-sub">剛剛 · 🌐</div></div><div class="p-more">···</div></div>` +
    `<div class="p-text">${pick(PEEK_CAPS)}</div>` +
    `<div class="ph" style="background:hsl(${hue} 30% 70%)"><img src="${photoURL(nextPhoto())}" alt="" draggable="false" onerror="this.remove()"></div>`;
}
function postHTML(c){
  const pool = STYLES.filter(st => st.ok(c));
  let st, tries = 0;
  do { st = pick(pool); tries++; } while (st === lastStyle && pool.length > 1 && tries < 8);
  lastStyle = st;
  const nm = pick(NAMES);
  const hue = Math.floor(Math.random() * 360);
  return `<div class="p-head"><div class="p-av" style="background:${nm[1]}">${nm[0][0]}</div>` +
    `<div><div class="p-name">${nm[0]}</div><div class="p-sub">剛剛 · 🌐</div></div><div class="p-more">···</div></div>` +
    `<div class="p-text">${pick(st.cap)}${pick(CAP_TAILS)}</div>` +
    `<div class="ph" style="background:hsl(${hue} 30% 70%)"><img src="${photoURL(nextPhoto())}" alt="" draggable="false" onerror="this.remove()">${st.html(c)}</div>` +
    `<div class="p-react"><span>👍❤️</span>你和其他朋友</div>` +
    `<div class="p-acts"><span class="like">${ICON_LIKE}讚</span><span>${ICON_CMT}留言</span><span>${ICON_SHARE}分享</span></div>`;
}
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function showPost(dir){
  const el = $("fb-post");
  const html = postHTML(total());
  const peek = $("fb-next");
  el.getAnimations().forEach(a => a.cancel());
  if (!dir || reduceMotion){ el.innerHTML = html; el.style.transform = ""; peek.innerHTML = peekHTML(); return; }
  const off = dir === "up" ? -1 : 1;
  const from = el.style.transform || "translateY(0)";
  const out = el.animate([{transform: from, opacity: 1}, {transform: `translateY(${off * 90}px)`, opacity: 0}], {duration: 120, easing: "ease-in"});
  out.onfinish = () => {
    el.innerHTML = html;
    peek.innerHTML = peekHTML();
    el.style.transform = "";
    el.animate([{transform: `translateY(${-off * 90}px)`, opacity: 0}, {transform: "translateY(0)", opacity: 1}], {duration: 180, easing: "ease-out"});
  };
}
function fbStep(v, dir){
  hist.push({l: "", v});
  vib();
  render(false);
  showPost(dir);
}
const feed = $("fb-feed");
let ty = null, tx = 0;
feed.addEventListener("touchstart", e => {
  if (e.touches.length > 1){ ty = null; return; }
  ty = e.touches[0].clientY; tx = e.touches[0].clientX;
}, {passive: true});
feed.addEventListener("touchmove", e => {
  e.preventDefault();
  if (ty === null) return;
  $("fb-post").style.transform = `translateY(${(e.touches[0].clientY - ty) * 0.35}px)`;
}, {passive: false});
function endTouch(e){
  if (ty === null) return;
  const t = e.changedTouches[0], dy = t.clientY - ty, dx = t.clientX - tx;
  ty = null;
  if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)){ dy < 0 ? fbStep(1, "up") : fbStep(-1, "down"); return; }
  const el = $("fb-post"), from = el.style.transform;
  el.style.transform = "";
  if (from && !reduceMotion) el.animate([{transform: from}, {transform: "translateY(0)"}], {duration: 150, easing: "ease-out"});
}
feed.addEventListener("touchend", endTouch);
feed.addEventListener("touchcancel", e => { ty = null; $("fb-post").style.transform = ""; });
let wheelLock = 0;
feed.addEventListener("wheel", e => {
  e.preventDefault();
  const now = Date.now();
  if (now < wheelLock || Math.abs(e.deltaY) < 15) return;
  wheelLock = now + 450;
  e.deltaY > 0 ? fbStep(1, "up") : fbStep(-1, "down");
}, {passive: false});

const fSheet = $("f-sheet");
let fClearArmed = false;
function closeFSheet(){ fSheet.hidden = true; fClearArmed = false; $("f-clear").textContent = "清除重來"; }
$("f-menu").onclick = () => { fSheet.hidden = false; };
fSheet.onclick = e => { if (e.target === fSheet) closeFSheet(); };
$("f-cancel").onclick = closeFSheet;
$("f-undo").onclick = () => { hist.pop(); render(false); showPost(null); closeFSheet(); };
$("f-clear").onclick = () => {
  if (!fClearArmed){ fClearArmed = true; $("f-clear").textContent = "再按一次確認清除"; return; }
  clearAll(); showPost(null); closeFSheet();
};
$("f-back").onclick = () => { closeFSheet(); setMode(lastCounterMode); };

/* ---- 模式切換 ---- */
function setMode(m){
  mode = m;
  const chat = m === "chat", fb = m === "fb";
  if (!chat && !fb) lastCounterMode = m;
  ["simple", "normal", "chat", "fb"].forEach(k => $("m-" + k).setAttribute("aria-pressed", k === m));
  $("p-simple").hidden = m !== "simple";
  $("p-normal").hidden = m !== "normal";
  $("counterView").hidden = chat || fb;
  $("chatView").hidden = !chat;
  $("fbView").hidden = !fb;
  document.title = chat ? "小美" : fb ? "動態" : "算牌紀錄器";
  $("themeColor").content = chat ? "#8CABD9" : fb ? "#FFFFFF" : "#123D2C";
  window.history.replaceState(null, "", chat ? "#chat" : fb ? "#fb" : location.pathname + location.search);
  if (chat){ syncChat(); const l = $("c-list"); l.scrollTop = l.scrollHeight; }
  if (fb) showPost(null);
}
$("m-simple").onclick = () => setMode("simple");
$("m-normal").onclick = () => setMode("normal");
$("m-chat").onclick = () => setMode("chat");
$("m-fb").onclick = () => setMode("fb");

$("undo").onclick = () => { hist.pop(); render(false); };

let armTimer;
$("reset").onclick = function(){
  if (this.classList.contains("arm")){
    clearTimeout(armTimer);
    this.classList.remove("arm");
    this.textContent = "全部重設";
    clearAll();
  } else {
    this.classList.add("arm");
    this.textContent = "再按一次確認";
    armTimer = setTimeout(() => { this.classList.remove("arm"); this.textContent = "全部重設"; }, 2500);
  }
};

if (location.hash === "#chat") setMode("chat");
else if (location.hash === "#fb") setMode("fb");
</script>
